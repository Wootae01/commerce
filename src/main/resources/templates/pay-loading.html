<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>결제 처리 중...</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6fb; }
        .loading-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.07);
        }
        .btn-primary { background-color: #4d9fff; border-color: #4d9fff; border-radius: 8px; }
        .btn-primary:hover { background-color: #3a8de8; border-color: #3a8de8; }
    </style>
</head>
<body>
<div class="container py-5" style="max-width: 520px;">
    <div class="card loading-card">
        <div class="card-body p-4 text-center">
            <div class="spinner-border" role="status" aria-label="결제 승인 처리 중" id="spinner">
                <span class="visually-hidden">Loading...</span>
            </div>
            <h4 class="mt-3 mb-1" id="titleText">결제 승인 처리 중...</h4>
            <p class="text-muted mb-0" id="descText">잠시만 기다려 주세요. 창을 닫거나 새로고침하지 마세요.</p>
            <hr class="my-4"/>
            <div class="text-start small text-muted">
                <div>주문번호: <span id="orderIdText">-</span></div>
                <div>금액: <span id="amountText">-</span></div>
            </div>
            <div class="alert alert-danger mt-3 d-none" id="errorBox" role="alert"></div>
            <button type="button" class="btn btn-outline-secondary w-100 mt-2 d-none" id="retryBtn">다시 시도</button>
            <!-- 결과를 모르면(202) 바로 보여 준다. 결제는 보정 스케줄러가 계속 확인한다 -->
            <div class="d-none" id="pendingBox">
                <div class="alert alert-warning mt-3 text-start mb-0" role="alert">
                    결제를 아직 확인하고 있습니다. 중복 결제를 막기 위해 다시 결제하지 마세요.
                    결과가 확정되면 주문내역에서 확인할 수 있습니다.
                </div>
                <p class="small text-muted mt-2 mb-0 d-none" id="stillPendingText">
                    아직 결과를 확인하고 있습니다. 잠시 후 다시 확인해 주세요.
                </p>
                <button type="button" class="btn btn-outline-secondary w-100 mt-3" id="recheckBtn">결과 다시 확인</button>
                <div class="d-flex gap-2 mt-2">
                    <a class="btn btn-outline-secondary flex-fill" href="/orders/list">주문내역으로</a>
                    <a class="btn btn-primary flex-fill" href="/">홈으로</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function () {
        const urlParams = new URLSearchParams(window.location.search);
        const paymentKey = urlParams.get("paymentKey");
        const orderId = urlParams.get("orderId");
        const amount = Number(urlParams.get("amount"));

        const orderIdText = document.getElementById("orderIdText");
        const amountText = document.getElementById("amountText");
        const errorBox = document.getElementById("errorBox");
        const retryBtn = document.getElementById("retryBtn");
        const spinner = document.getElementById("spinner");
        const titleText = document.getElementById("titleText");
        const descText = document.getElementById("descText");
        const pendingBox = document.getElementById("pendingBox");
        const recheckBtn = document.getElementById("recheckBtn");
        const stillPendingText = document.getElementById("stillPendingText");

        orderIdText.textContent = orderId ?? "-";
        amountText.textContent = amount ? (amount + "원") : "-";

        if (!paymentKey || !orderId || !amount) {
            showError("결제 정보가 올바르지 않습니다. (파라미터 누락)");
            return;
        }

        // 결과를 모를 때(202) 기다리게 하지 않는다. 조회 API는 DB만 읽고, 결과는 1분 뒤 보정 스케줄러가 확정하므로
        // 몇 초 더 조회해도 바뀌지 않는다. 사용자가 "결과 다시 확인"을 누를 때만 한 번 조회한다
        recheckBtn.addEventListener("click", async () => {
            recheckBtn.disabled = true;
            stillPendingText.classList.add("d-none");
            const resolved = await checkResult();
            if (!resolved) {
                stillPendingText.classList.remove("d-none");
                recheckBtn.disabled = false;
            }
        });

        const confirmOnceKey = `confirm_once:${paymentKey}`;
        if (sessionStorage.getItem(confirmOnceKey) === "1") {
            // 새로고침: 확정 요청은 이미 보냈으므로 결과만 조회한다 (확인 중이던 주문을 성공으로 보내지 않도록)
            titleText.textContent = "결제를 확인하고 있습니다...";
            descText.textContent = "결제 결과를 확인하는 중입니다. 잠시만 기다려 주세요.";
            checkResult().then(resolved => {
                if (!resolved) {
                    showPending();
                }
            });
            return;
        }

        retryBtn.addEventListener("click", () => {
            errorBox.classList.add("d-none");
            retryBtn.classList.add("d-none");
            doConfirm();
        });

        doConfirm();

        async function doConfirm() {
            try {
                sessionStorage.setItem(confirmOnceKey, "1");
                const csrfToken = document.querySelector('meta[name="_csrf"]').content;
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
                const res = await fetch("/pay/confirm", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", [csrfHeader]: csrfToken },
                    body: JSON.stringify({ paymentKey, orderId, amount })
                });
                const json = await res.json().catch(() => ({}));
                if (!res.ok) {
                    // 결제 실패면 message가 실패 이유다. 실패 코드는 사용자에게 보여주지 않는다
                    goFail(json?.message ?? "결제 승인에 실패했습니다.", "");
                    return;
                }
                if (res.status === 202) {
                    showPending();
                    return;
                }
                goSuccess();
            } catch (e) {
                sessionStorage.removeItem(confirmOnceKey);
                showError("네트워크 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
            }
        }

        // 결제 결과를 한 번 조회해 PAID면 성공, CANCELED면 실패 화면으로 이동하고 true.
        // 그 외(PAYMENT_PENDING 등)나 조회 실패는 false (화면을 바꾸지 않는다)
        async function checkResult() {
            const result = await fetchPaymentResult();
            if (result?.orderStatus === "PAID") {
                goSuccess();
                return true;
            }
            if (result?.orderStatus === "CANCELED") {
                // 실패 이유가 없으면(실패 이유를 남기기 전의 주문) 기본 문장
                goFail(result.failureMessage ?? "결제가 승인되지 않았습니다.", "");
                return true;
            }
            return false;
        }

        // 결제 결과(주문 상태·실패 이유). 조회 실패(네트워크 오류 등)는 null
        async function fetchPaymentResult() {
            try {
                const res = await fetch(`/api/payments/${encodeURIComponent(orderId)}`, {
                    headers: { "Accept": "application/json" }
                });
                if (!res.ok) {
                    return null;
                }
                const json = await res.json();
                return json?.data ?? null;
            } catch (e) {
                return null;
            }
        }

        function goSuccess() {
            window.location.replace(`/pay/success?orderId=${encodeURIComponent(orderId)}`);
        }

        function goFail(message, code) {
            window.location.replace(`/pay/fail?message=${encodeURIComponent(message)}&code=${encodeURIComponent(code)}`);
        }

        function showPending() {
            spinner.classList.add("d-none");
            titleText.textContent = "결제 확인 중";
            descText.textContent = "결제 결과 확인이 늦어지고 있습니다.";
            pendingBox.classList.remove("d-none");
        }

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.remove("d-none");
            retryBtn.classList.remove("d-none");
        }
    })();
</script>
</body>
</html>
